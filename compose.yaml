x-app-environment: &app-environment
  APP_APP_NAME: ${APP_APP_NAME:-Product Radar}
  APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
  APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:3000}
  APP_DATABASE_PATH: /app/data/product_radar.sqlite3
  APP_RAW_ROOT: /app/data/raw
  APP_REPORTS_ROOT: /app/reports
  APP_BACKUPS_ROOT: /app/backups
  APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
  APP_WORKER_POLL_SECONDS: ${APP_WORKER_POLL_SECONDS:-2}
  APP_WORKER_HEARTBEAT_SECONDS: ${APP_WORKER_HEARTBEAT_SECONDS:-10}

x-api-build: &api-build
  context: .
  dockerfile: Dockerfile.api
  args:
    APP_UID: ${APP_UID:-1000}
    APP_GID: ${APP_GID:-1000}

x-app-volumes: &app-volumes
  - ./data:/app/data
  - ./reports:/app/reports
  - ./backups:/app/backups

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: product-radar-frontend:0.1.0
    environment:
      API_INTERNAL_URL: http://api:8000
      PORT: ${APP_FRONTEND_PORT:-3000}
      APP_ALLOWED_HOSTS: ${APP_ALLOWED_HOSTS:-["*"]}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "0.0.0.0:3000:${APP_FRONTEND_PORT:-3000}"
    restart: unless-stopped
    networks:
      backend:
      ingress:
        # The existing remotely managed tunnel routes to http://web:8000.
        # PORT=8000 in .env reuses that route without any Cloudflare API key.
        aliases:
          - web
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.PORT || '3000') + '/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  api:
    build: *api-build
    image: product-radar-api:0.1.0
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment: *app-environment
    volumes: *app-volumes
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build: *api-build
    image: product-radar-api:0.1.0
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment: *app-environment
    volumes: *app-volumes
    restart: unless-stopped
    networks:
      - backend
      # The worker alone needs outbound HTTPS for Mercado Libre OAuth and API
      # calls; it still publishes no ports.
      - ingress
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  cloudflared:
    profiles: ["remote"]
    image: cloudflare/cloudflared:2026.10.5@sha256:1b1d34d0a9c0bfca9de72db8460d328db3f19edd2b96169114e3e893a97bbe53
    command: ["tunnel", "--no-autoupdate", "--loglevel", "info", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - ingress
    depends_on:
      frontend:
        condition: service_healthy

networks:
  backend:
    internal: true
  ingress:
